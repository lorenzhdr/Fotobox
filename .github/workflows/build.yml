name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Fotobox.sln -c Release

      - name: Tests (ohne Hardware)
        run: dotnet test Fotobox.sln -c Release --no-build --filter "Category!=Hardware" --blame-hang-timeout 5m --blame-hang-dump-type none
