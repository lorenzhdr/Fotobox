name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Fotobox.sln -c Release

      - name: Tests (ohne Hardware)
        run: dotnet test Fotobox.sln -c Release --no-build --filter "Category!=Hardware" --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Publish x64 (mit VC++-Runtime und Abhängigkeitsprüfung)
        shell: pwsh
        run: ./build/publish.ps1 -Arch x64 -RequireVcRuntime

      - name: Smoke-Test x64
        shell: pwsh
        run: ./build/smoke-test.ps1 -PublishDir artifacts/publish/x64

      # Testpaket für Praxistests vor dem Release (z. B. auf anderer Hardware); kein Release-Artefakt.
      - name: Testpaket x64 hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FotoboxPlus-x64-portable-test
          path: artifacts/FotoboxPlus-*-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
